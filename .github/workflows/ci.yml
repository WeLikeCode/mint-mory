name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        # --extra cochange installs scikit-learn so the document co-change HDBSCAN
        # path is exercised; --extra otel installs the OpenTelemetry SDK so the
        # telemetry activation + OTLP metric-exporter path (MM-42) is actually
        # tested (fallback/no-op paths are still covered via monkeypatched tests).
        # --extra postgres installs psycopg/pgvector so mypy can type-check
        # storage_postgres.py (MM-48); the PG-backed tests still skip here with no
        # MINTMORY_TEST_PG_DSN — they run in the conformance-pg job below.
        # --frozen installs strictly from the committed uv.lock (MM-44) and fails
        # loudly if the lock drifted from pyproject.toml (regen with `uv lock`).
        run: uv sync --frozen --extra cochange --extra otel --extra postgres

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy packages

      - name: Pytest (coverage gate ≥ 80%)
        run: uv run pytest -q

  conformance-pg:
    name: PG conformance · golden recall · soak
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mintmory
          POSTGRES_DB: mintmory
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (postgres extra)
        run: uv sync --frozen --extra postgres --extra cochange --extra otel

      # These runs target a SUBSET (the postgres leg / soak), so the repo-wide
      # --cov-fail-under=80 in pyproject does not apply — disable coverage here
      # (the full-suite coverage gate lives in the `gates` job). Without --no-cov
      # the subset trips "Coverage failure: total ... less than fail-under=80".
      - name: Conformance suite (postgres backend)
        env:
          MINTMORY_TEST_PG_DSN: "postgresql://postgres:mintmory@localhost:55432/mintmory"
        run: |
          uv run pytest packages/core/tests/conformance/ \
            -k postgres \
            --no-cov \
            -v \
            --tb=short

      - name: Golden retrieval recall (postgres backend)
        env:
          MINTMORY_TEST_PG_DSN: "postgresql://postgres:mintmory@localhost:55432/mintmory"
        run: |
          uv run pytest packages/core/tests/conformance/test_golden_retrieval.py \
            -k postgres \
            --no-cov \
            -v \
            --tb=short

      - name: Soak test (postgres concurrent)
        env:
          MINTMORY_TEST_PG_DSN: "postgresql://postgres:mintmory@localhost:55432/mintmory"
        run: |
          uv run pytest packages/core/tests/test_pg_soak.py \
            --no-cov \
            -v \
            --tb=short

      - name: Migration round-trip (SQLite -> postgres, MM-49)
        env:
          MINTMORY_TEST_PG_DSN: "postgresql://postgres:mintmory@localhost:55432/mintmory"
        run: |
          uv run pytest packages/core/tests/test_migrate.py \
            --no-cov \
            -v \
            --tb=short

  deploy-validate:
    name: helm lint · template · dry-run · docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      # Install kubeconform for OFFLINE manifest schema validation. NOTE: modern
      # kubectl (>=1.28) `apply --dry-run=client` still needs a reachable API
      # server (OpenAPI download + REST discovery), so it cannot validate on a
      # cluster-less runner. kubeconform is the standard cluster-free equivalent
      # and validates each rendered resource against the k8s JSON schemas.
      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Helm lint
        run: helm lint deploy/helm/mintmory

      - name: Helm template (simple/default tier)
        run: helm template t deploy/helm/mintmory > /tmp/render-simple.yaml

      - name: Helm template (advanced tier)
        run: |
          helm template t deploy/helm/mintmory \
            -f deploy/helm/mintmory/values-advanced.yaml > /tmp/render-advanced.yaml

      - name: Validate rendered manifests (simple)
        run: |
          helm template t deploy/helm/mintmory \
            | kubeconform -strict -summary -kubernetes-version 1.29.0 -

      - name: Validate rendered manifests (advanced)
        run: |
          helm template t deploy/helm/mintmory \
            -f deploy/helm/mintmory/values-advanced.yaml \
            | kubeconform -strict -summary -kubernetes-version 1.29.0 -

      # Build-smoke only — the light image. No registry push; the full/torch
      # variant is documented in the chart README but not built in CI (size/time).
      - name: Docker build (light variant)
        run: docker build --build-arg VARIANT=light -t mintmory:ci .

  publish-image:
    name: Publish light image to GHCR
    runs-on: ubuntu-latest
    # Only publish an image that passed lint/types/tests AND helm/kubeconform/build.
    needs: [gates, deploy-validate]
    # Publish on pushes (default-branch commits + release tags), never on PRs
    # (a PR validates the build but must not push, incl. from forks).
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # buildx `docker-container` driver — required for the `type=gha` cache
      # exporter below (the default `docker` driver cannot export build cache).
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      # LIGHT variant only. The full/torch image (~2 GB) is build-on-demand
      # (`docker build --build-arg VARIANT=full`), never auto-published.
      - name: Build and push (light variant)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: VARIANT=light
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
