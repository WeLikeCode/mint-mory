{{- $secrets := dict }}
{{- range $key, $val := .Values.secrets }}
{{- if $val }}
{{- $_ := set $secrets $key $val }}
{{- end }}
{{- end }}
{{- if gt (len $secrets) 0 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mintmory.fullname" . }}-secrets
  labels:
    {{- include "mintmory.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $val := $secrets }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
