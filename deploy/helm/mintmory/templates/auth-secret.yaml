{{- if and .Values.ingress.enabled .Values.ingress.basicAuth.enabled (not .Values.ingress.basicAuth.existingSecret) }}
{{- if or (not .Values.ingress.basicAuth.username) (not .Values.ingress.basicAuth.password) }}
{{- fail "ingress.basicAuth.enabled requires username+password (or set ingress.basicAuth.existingSecret)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mintmory.basicAuthSecretName" . }}
  labels:
    {{- include "mintmory.labels" . | nindent 4 }}
type: Opaque
stringData:
  # ingress-nginx expects an htpasswd file under the key "auth".
  auth: {{ htpasswd .Values.ingress.basicAuth.username .Values.ingress.basicAuth.password | quote }}
{{- end }}
