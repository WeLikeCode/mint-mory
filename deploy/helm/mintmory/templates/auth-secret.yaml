{{- if and (eq .Values.auth.mode "basic") (not .Values.auth.basic.existingSecret) }}
{{- if or (not .Values.auth.basic.username) (not .Values.auth.basic.password) }}
{{- fail "auth.mode=basic requires auth.basic.username+password (or set auth.basic.existingSecret)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mintmory.basicAuthSecretName" . }}
  labels:
    {{- include "mintmory.labels" . | nindent 4 }}
type: Opaque
stringData:
  # ingress-nginx expects an htpasswd file under the key "auth".
  auth: {{ htpasswd .Values.auth.basic.username .Values.auth.basic.password | quote }}
{{- end }}
