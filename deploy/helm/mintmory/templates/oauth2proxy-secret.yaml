{{- if eq .Values.auth.mode "oauth2proxy" }}
{{- if or (not .Values.auth.oauth2proxy.oidcIssuerUrl) (not .Values.auth.oauth2proxy.clientId) (not .Values.auth.oauth2proxy.clientSecret) }}
{{- fail "auth.mode=oauth2proxy requires auth.oauth2proxy.oidcIssuerUrl, clientId and clientSecret" }}
{{- end }}
{{- /*
  Cookie secret: use the explicit value if set; else REUSE the one already stored
  (via lookup) so `helm upgrade` does not rotate it and log out every SSO session;
  else generate a fresh 32-byte (base64) secret on first install.
*/ -}}
{{- $name := include "mintmory.oauth2ProxyName" . -}}
{{- $cookie := .Values.auth.oauth2proxy.cookieSecret -}}
{{- if not $cookie -}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
  {{- if and $existing $existing.data (index $existing.data "cookie-secret") -}}
    {{- $cookie = index $existing.data "cookie-secret" | b64dec -}}
  {{- else -}}
    {{- $cookie = randAlphaNum 32 | b64enc -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mintmory.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ .Values.auth.oauth2proxy.clientSecret | quote }}
  # 32-byte (base64) cookie secret — supplied, reused from the live Secret, or generated.
  cookie-secret: {{ $cookie | quote }}
{{- end }}
