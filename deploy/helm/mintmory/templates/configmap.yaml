apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mintmory.fullname" . }}-config
  labels:
    {{- include "mintmory.labels" . | nindent 4 }}
data:
  # Non-secret MINTMORY_* passthrough. Each key rendered only when set.
  {{- range $key, $val := .Values.config }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- if .Values.otel.enabled }}
  # OpenTelemetry (BYO OTLP collector). MM-42 reads these at startup.
  MINTMORY_OTEL_ENABLED: "true"
  MINTMORY_OTEL_EXPORTER: "otlp"
  MINTMORY_OTEL_SERVICE_NAME: {{ .Values.otel.serviceName | quote }}
  {{- if .Values.otel.endpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.endpoint | quote }}
  {{- end }}
  {{- end }}
