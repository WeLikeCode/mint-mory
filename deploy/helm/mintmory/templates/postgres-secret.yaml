{{- $backend := .Values.storage.backend | default "sqlite" }}
{{- if eq $backend "postgres" }}
{{- /*
  Validation: postgres mode requires a DSN source — either an inline DSN (stored in a
  chart-created Secret) or a reference to an operator-managed Secret (existingSecret).
  Having neither is a configuration error caught at template-render time.
*/}}
{{- if and (not .Values.storage.postgres.dsn) (not .Values.storage.postgres.existingSecret) }}
{{- fail "storage.backend=postgres requires a DSN source: set storage.postgres.dsn OR storage.postgres.existingSecret" }}
{{- end }}
{{- /*
  Only create the Secret when the operator has NOT provided one externally.
  When existingSecret is set, the Deployment's secretKeyRef points at that Secret directly
  and we emit nothing here.
*/}}
{{- if not .Values.storage.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mintmory.postgresSecretName" . }}
  labels:
    {{- include "mintmory.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # The libpq DSN — injected into the pod as MINTMORY_STORAGE_DSN via secretKeyRef.
  # NEVER move this value to a ConfigMap or a plain env block.
  dsn: {{ .Values.storage.postgres.dsn | quote }}
{{- end }}
{{- end }}
