{{- $backend := .Values.storage.backend | default "sqlite" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mintmory.fullname" . }}
  labels:
    {{- include "mintmory.labels" . | nindent 4 }}
spec:
  {{- if eq $backend "postgres" }}
  # Postgres mode: stateless pods — N replicas, RollingUpdate, no PVC.
  replicas: {{ .Values.replicaCount | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxUnavailable 0: never take a pod down before a new one is ready.
      maxUnavailable: 0
      maxSurge: 1
  {{- else }}
  # SQLite mode: single-writer — exactly one replica, always Recreate.
  # values.schema.json caps replicaCount at 1; min() is a belt-and-braces guard.
  replicas: {{ min 1 (.Values.replicaCount | default 1) }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "mintmory.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mintmory.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "mintmory.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- if eq $backend "postgres" }}
            # Postgres mode: tell the app which backend to use and inject the DSN from a Secret.
            # The DSN is NEVER in a ConfigMap or plaintext env — always secretKeyRef.
            - name: MINTMORY_STORAGE_BACKEND
              value: postgres
            - name: MINTMORY_STORAGE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "mintmory.postgresSecretName" . }}
                  key: {{ .Values.storage.postgres.existingSecretKey | default "dsn" }}
            {{- else }}
            # SQLite mode: point the app at the PVC-backed data directory.
            - name: MINTMORY_DB
              value: /data/memories.db
            {{- end }}
            # Pool sizing (postgres only; ignored in sqlite mode).
            {{- if eq $backend "postgres" }}
            - name: MINTMORY_STORAGE_POOL_MIN
              value: {{ .Values.storage.postgres.pool.min | default 2 | quote }}
            - name: MINTMORY_STORAGE_POOL_MAX
              value: {{ .Values.storage.postgres.pool.max | default 10 | quote }}
            {{- end }}
            {{- range $key, $val := .Values.secrets }}
            {{- if $val }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "mintmory.fullname" $ }}-secrets
                  key: {{ $key }}
            {{- end }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "mintmory.fullname" . }}-config
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            # /readyz gates on PG reachability (ping()) in postgres mode; the probe
            # timeout is intentionally tight (2 s) so a DB blip flips readiness, not
            # liveness, avoiding a crash-loop on a transient network hiccup.
            httpGet:
              path: {{ .Values.probes.readiness }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if ne $backend "postgres" }}
            # SQLite mode: mount the PVC at /data.
            - name: data
              mountPath: /data
            {{- end }}
            # readOnlyRootFilesystem: true -> give the app a writable scratch dir.
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if ne $backend "postgres" }}
        # SQLite mode: data volume backed by a PVC (or emptyDir when persistence is off).
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "mintmory.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        # readOnlyRootFilesystem: true -> give the app a writable scratch dir.
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq $backend "postgres" }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        # Postgres mode: prefer spreading replicas across nodes (soft anti-affinity).
        # Override with affinity: {} in values to disable, or set a custom affinity.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "mintmory.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
        {{- end }}
      {{- else }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
