apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mintmory.fullname" . }}
  labels:
    {{- include "mintmory.labels" . | nindent 4 }}
spec:
  # SQLite is single-writer: exactly one replica, always. values.schema.json
  # caps replicaCount at 1; `min` is a second belt-and-braces guard.
  replicas: {{ min 1 (.Values.replicaCount | default 1) }}
  # Recreate (never RollingUpdate) so two pods never hold the WAL at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mintmory.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mintmory.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "mintmory.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MINTMORY_DB
              value: /data/memories.db
            {{- range $key, $val := .Values.secrets }}
            {{- if $val }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "mintmory.fullname" $ }}-secrets
                  key: {{ $key }}
            {{- end }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "mintmory.fullname" . }}-config
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "mintmory.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        # readOnlyRootFilesystem: true -> give the app a writable scratch dir.
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
